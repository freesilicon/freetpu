# Legacy Kubernetes 1.32-1.33 DRA workload sample using `resource.k8s.io/v1beta1`.
# For current Kubernetes (>= 1.34) clusters serving stable DRA, use `k8s-tpu-pod-cdi.yaml`
# (`resource.k8s.io/v1`) instead.
# Prerequisites:
#   1. Kubernetes API server configured with the beta DRA API group explicitly enabled:
#        --runtime-config=resource.k8s.io/v1beta1=true
#      and feature gate `DynamicResourceAllocation=true`.
#   2. Patched containerd (`2.1.x` >= 2.1.9, `2.2.x` >= 2.2.5, `2.3.x` >= 2.3.2,
#      or >= 2.4.0 — excluding vulnerable `2.0.x`, `2.1.0-2.1.8`, `2.2.0-2.2.4`,
#      and `2.3.0-2.3.1` — or a distro/GKE build patched for CVE-2026-53492 /
#      GHSA-33vj-92qq-66hc / GCP-2026-037) —
#      or disable/block untrusted container checkpoint restores on TPU nodes
#      before publishing `/var/run/cdi/freetpu.json` (unpatched containerd 2.x
#      allows checkpoint restores to bypass DRA and grab published CDI devices
#      including `freetpu.dev/tpu=all`; containerd 1.7.0 also lacks CDI v0.6.0
#      and CRI `CDIDevices`) and boot-scoped /var/run/cdi/freetpu.json populated
#      by k8s-tpu-cdi-daemonset.yaml on VFIO-backed Cloud TPU nodes (v5e, v5p, v6e).
#   3. A cluster DRA kubelet/controller driver registered for `freetpu.dev` publishing
#      ResourceSlices and injecting `freetpu.dev/tpu=...` CDI IDs in NodePrepareResources.
#   4. GKE exclusive TPU allocation: on GKE, run FreeTPU DRA claims ONLY on a
#      dedicated/tainted TPU node pool where `google.com/tpu` scheduling is
#      unused/disabled, OR use a DRA driver that coordinates exclusive chip
#      ownership with GKE's native `google.com/tpu` allocator to prevent
#      concurrent double-allocation of the same VFIO group.
---
apiVersion: resource.k8s.io/v1beta1
kind: DeviceClass
metadata:
  name: freetpu.dev
spec:
  selectors:
    - cel:
        expression: device.driver == "freetpu.dev"
---
apiVersion: resource.k8s.io/v1beta1
kind: ResourceClaimTemplate
metadata:
  name: freetpu-all-claim
  namespace: ml-workloads
spec:
  spec:
    devices:
      requests:
        - name: tpu
          deviceClassName: freetpu.dev
---
apiVersion: v1
kind: Pod
metadata:
  name: freetpu-jax-workload
  namespace: ml-workloads
spec:
  restartPolicy: Never
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: jax-tpu
      image: python:3.12-slim
      command:
        - python3
        - -c
        - "import os; print('VFIO nodes:', sorted(os.listdir('/dev/vfio')))"
      securityContext:
        capabilities:
          add:
            - IPC_LOCK
      resources:
        claims:
          - name: tpu
        requests:
          memory: "8Gi"
          cpu: "2"
        limits:
          memory: "16Gi"
          cpu: "4"
  resourceClaims:
    - name: tpu
      resourceClaimTemplateName: freetpu-all-claim
