# FreeTPU Node DaemonSet (VFIO-backed GKE Cloud TPU nodes: v5e, v5p, v6e Trillium):
# Scope: Node-level boot-scoped CDI spec sync + PCI/VFIO inventory & hostPID
# active-PID telemetry ONLY. This DaemonSet uses stock `python:3.12-slim` without
# `tpu-info` and runs outside workload Pod network namespaces, so it does NOT emit
# live HBM usage or MXU duty cycle. For live HBM + duty-cycle telemetry in
# Kubernetes, run a `tpu-info`-enabled exporter sidecar inside each TPU workload
# Pod so it shares `localhost:8431` with `libtpu` (see
# `k8s-tpu-workload-telemetry-sidecar.yaml`).
#
# Prerequisite (create the required ConfigMap in kube-system first):
#   kubectl -n kube-system create configmap freetpu-ops-scripts \
#     --from-file=ops/tpu-cdi/freetpu_cdi.py \
#     --from-file=ops/tpu-exporter/tpu_exporter.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Targets VFIO-backed GKE TPU node pools (`tpu-v5-lite-device`,
# `tpu-v5-lite-podslice`, `tpu-v5p-slice`, `tpu-v6e-slice`); excludes legacy
# `/dev/accel*` v4 node pools (`tpu-v4-podslice`). Adjust `nodeAffinity` if your
# cluster uses custom TPU node labels.
#
# 1. `freetpu-cdi-sync` handles initial boot-scoped `/var/run/cdi/freetpu.json`
#    publication and continuous revalidation/retries independently of
#    `tpu-exporter`. It regenerates `/var/run/cdi/freetpu.json` atomically on
#    valid topology changes and unlinks it immediately if a VFIO group is
#    reassigned, missing, or exposes a non-TPU device—without blocking node
#    telemetry when a chip is unhealthy or unbound.
# 2. `tpu-exporter` always starts immediately and serves PCI/VFIO inventory
#    (including unhealthy/unbound chips) and hostPID active-PID Prometheus
#    `/metrics` on :9400 (with SYS_PTRACE + AppArmor Unconfined, required on GKE
#    because GKE's default container AppArmor profile blocks ptrace-mediated
#    `/proc/<pid>/fd` reads across peers with different AppArmor profiles;
#    `appArmorProfile` is GA in Kubernetes >= 1.30) and an isolated
#    liveness/readiness endpoint on :9401 (`/healthz`) independent of scrape
#    traffic saturation.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: freetpu-node-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: freetpu-tpu-exporter
    app.kubernetes.io/component: tpu-ops
    freetpu.dev/collector-role: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: freetpu-tpu-exporter
      freetpu.dev/collector-role: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freetpu-tpu-exporter
        freetpu.dev/collector-role: node
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
        prometheus.io/path: "/metrics"
    spec:
      hostPID: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-tpu-accelerator
                    operator: In
                    values:
                      - tpu-v5-lite-device
                      - tpu-v5-lite-podslice
                      - tpu-v5p-slice
                      - tpu-v6e-slice
      tolerations:
        - key: google.com/tpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: freetpu-cdi-sync
          image: python:3.12-slim
          command:
            - python3
            - /opt/freetpu/freetpu_cdi.py
            - sync
            - --output
            - /var/run/cdi/freetpu.json
            - --interval
            - "15"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            # Mount only the narrow sysfs subpaths needed for PCI and IOMMU
            # discovery (never whole-host /sys) so containerd's read-only
            # /sys/fs/cgroup mount is never shadowed by a writable host cgroup.
            - name: sysfs-bus-pci
              mountPath: /sys/bus/pci
              readOnly: true
            - name: sysfs-devices
              mountPath: /sys/devices
              readOnly: true
            - name: sysfs-iommu-groups
              mountPath: /sys/kernel/iommu_groups
              readOnly: true
            - name: dev-vfio
              mountPath: /dev/vfio
              readOnly: true
            - name: cdi-dir
              mountPath: /var/run/cdi
            - name: freetpu-ops
              mountPath: /opt/freetpu
              readOnly: true
        - name: tpu-exporter
          image: python:3.12-slim
          command:
            - python3
            - /opt/freetpu/tpu_exporter.py
            - --host
            - 0.0.0.0
            - --port
            - "9400"
            - --health-host
            - 127.0.0.1
            - --health-port
            - "9401"
          securityContext:
            # Required on GKE alongside hostPID + SYS_PTRACE: GKE's default
            # AppArmor profile restricts ptrace-mediated /proc/<pid>/fd reads
            # to peers sharing the same profile, which otherwise blocks reads
            # of host processes and suppresses host-wide PID telemetry.
            appArmorProfile:
              type: Unconfined
            capabilities:
              add:
                - SYS_PTRACE
          ports:
            - name: metrics
              containerPort: 9400
              protocol: TCP
          # Health listener binds strictly to 127.0.0.1:9401 (never exposed on
          # the pod network) and is checked via local exec probes so remote pods
          # cannot exhaust health slots or trigger spurious liveness restarts.
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9401/readyz', timeout=2).read()"
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9401/healthz', timeout=2).read()"
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: sysfs-bus-pci
              mountPath: /sys/bus/pci
              readOnly: true
            - name: sysfs-devices
              mountPath: /sys/devices
              readOnly: true
            - name: dev-vfio
              mountPath: /dev/vfio
              readOnly: true
            - name: freetpu-ops
              mountPath: /opt/freetpu
              readOnly: true
      volumes:
        - name: sysfs-bus-pci
          hostPath:
            path: /sys/bus/pci
            type: Directory
        - name: sysfs-devices
          hostPath:
            path: /sys/devices
            type: Directory
        - name: sysfs-iommu-groups
          hostPath:
            path: /sys/kernel/iommu_groups
            type: Directory
        - name: dev-vfio
          hostPath:
            # DirectoryOrCreate lets the DaemonSet start even if vfio-pci failed
            # to initialize so tpu-exporter can still report unhealthy chips and
            # freetpu-cdi-sync can invalidate any stale CDI spec.
            path: /dev/vfio
            type: DirectoryOrCreate
        - name: cdi-dir
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: freetpu-ops
          configMap:
            name: freetpu-ops-scripts
