# FreeTPU Node DaemonSets (VFIO-backed GKE Cloud TPU nodes: v5e, v5p, v6e Trillium):
# Scope:
#   1. `DaemonSet/freetpu-node-agent` (default on VFIO-backed TPU nodes):
#      PCI/VFIO inventory & hostPID active-PID Prometheus telemetry ONLY (does NOT
#      mount `/var/run/cdi` or publish CDI specs). Uses stock `python:3.12-slim`
#      without `tpu-info` and runs outside workload Pod network namespaces, so it
#      does NOT emit live HBM usage or MXU duty cycle. For live HBM + duty-cycle
#      telemetry in Kubernetes, run a `tpu-info`-enabled exporter sidecar inside
#      each TPU workload Pod (`k8s-tpu-workload-telemetry-sidecar.yaml`).
#   2. `DaemonSet/freetpu-cdi-sync` (OPT-IN CDI publisher):
#      Publishes boot-scoped `/var/run/cdi/freetpu.json` ONLY on TPU nodes
#      explicitly labeled `freetpu.dev/cdi-enabled=true`.
#      SECURITY PREREQUISITE (CVE-2026-53492 / GHSA-33vj-92qq-66hc / GCP-2026-037):
#      Unpatched containerd 2.x releases allow a tenant with Pod creation rights
#      to smuggle CDI annotations via untrusted container checkpoint restores and
#      bypass DRA to access every published CDI device (including
#      `freetpu.dev/tpu=all`). Before labeling any node `freetpu.dev/cdi-enabled=true`,
#      verify the node runs a containerd release patched for CVE-2026-53492
#      (`2.1.x` >= 2.1.9, `2.2.x` >= 2.2.5, `2.3.x` >= 2.3.2, or >= 2.4.0 —
#      excluding vulnerable `2.0.x`, `2.1.0-2.1.8`, `2.2.0-2.2.4`, and
#      `2.3.0-2.3.1` — or a distro/GKE patched build) OR that untrusted
#      container checkpoint restores are disabled/blocked on the node.
#      Telemetry-only installations should leave `freetpu.dev/cdi-enabled` unset.
#      On graceful opt-out or DaemonSet deletion (`SIGTERM`), `freetpu-cdi-sync`
#      passes `--unlink-on-exit` to remove `/var/run/cdi/freetpu.json`; after
#      forced termination (`SIGKILL`), delete `/var/run/cdi/freetpu.json` on the
#      host manually.
#
# Prerequisite (create the required ConfigMap in kube-system first):
#   kubectl -n kube-system create configmap freetpu-ops-scripts \
#     --from-file=ops/tpu-cdi/freetpu_cdi.py \
#     --from-file=ops/tpu-exporter/tpu_exporter.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Targets VFIO-backed GKE TPU node pools (`tpu-v5-lite-device`,
# `tpu-v5-lite-podslice`, `tpu-v5p-slice`, `tpu-v6e-slice`); excludes legacy
# `/dev/accel*` v4 node pools (`tpu-v4-podslice`). Adjust `nodeAffinity` if your
# cluster uses custom TPU node labels.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: freetpu-node-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: freetpu-tpu-exporter
    app.kubernetes.io/component: tpu-ops
    freetpu.dev/collector-role: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: freetpu-tpu-exporter
      freetpu.dev/collector-role: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freetpu-tpu-exporter
        freetpu.dev/collector-role: node
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
        prometheus.io/path: "/metrics"
    spec:
      hostPID: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-tpu-accelerator
                    operator: In
                    values:
                      - tpu-v5-lite-device
                      - tpu-v5-lite-podslice
                      - tpu-v5p-slice
                      - tpu-v6e-slice
      tolerations:
        - key: google.com/tpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: tpu-exporter
          image: python:3.12-slim
          command:
            - python3
            - /opt/freetpu/tpu_exporter.py
            - --host
            - 0.0.0.0
            - --port
            - "9400"
            - --health-host
            - 127.0.0.1
            - --health-port
            - "9401"
          securityContext:
            # Required on GKE alongside hostPID + SYS_PTRACE: GKE's default
            # AppArmor profile restricts ptrace-mediated /proc/<pid>/fd reads
            # to peers sharing the same profile, which otherwise blocks reads
            # of host processes and suppresses host-wide PID telemetry.
            appArmorProfile:
              type: Unconfined
            capabilities:
              add:
                - SYS_PTRACE
          ports:
            - name: metrics
              containerPort: 9400
              protocol: TCP
          # Health listener binds strictly to 127.0.0.1:9401 (never exposed on
          # the pod network) and is checked via local exec probes so remote pods
          # cannot exhaust health slots or trigger spurious liveness restarts.
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9401/readyz', timeout=2).read()"
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9401/healthz', timeout=2).read()"
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            # Mount only the narrow sysfs subpaths needed for PCI and IOMMU
            # discovery (never whole-host /sys) so containerd's read-only
            # /sys/fs/cgroup mount is never shadowed by a writable host cgroup.
            - name: sysfs-bus-pci
              mountPath: /sys/bus/pci
              readOnly: true
            - name: sysfs-devices
              mountPath: /sys/devices
              readOnly: true
            - name: sysfs-iommu-groups
              mountPath: /sys/kernel/iommu_groups
              readOnly: true
            - name: dev-vfio
              mountPath: /dev/vfio
              readOnly: true
            - name: freetpu-ops
              mountPath: /opt/freetpu
              readOnly: true
      volumes:
        - name: sysfs-bus-pci
          hostPath:
            path: /sys/bus/pci
            type: Directory
        - name: sysfs-devices
          hostPath:
            path: /sys/devices
            type: Directory
        - name: sysfs-iommu-groups
          hostPath:
            path: /sys/kernel/iommu_groups
            type: Directory
        - name: dev-vfio
          hostPath:
            # DirectoryOrCreate lets the DaemonSet start even if vfio-pci failed
            # to initialize so tpu-exporter can still report unhealthy chips.
            path: /dev/vfio
            type: DirectoryOrCreate
        - name: freetpu-ops
          configMap:
            name: freetpu-ops-scripts
---
# Opt-in CDI spec publisher DaemonSet.
# Schedules ONLY on VFIO-backed TPU nodes explicitly labeled:
#   kubectl label node <tpu-node> freetpu.dev/cdi-enabled=true
# ONLY label nodes verified to run a containerd release patched for
# CVE-2026-53492 (`2.1.x` >= 2.1.9, `2.2.x` >= 2.2.5, `2.3.x` >= 2.3.2, or
# >= 2.4.0 — excluding `2.0.x`, `2.1.0-2.1.8`, `2.2.0-2.2.4`, `2.3.0-2.3.1` —
# or a distro/GKE patched build for GHSA-33vj-92qq-66hc / GCP-2026-037) OR with
# untrusted container checkpoint restores disabled/blocked. Removing the label
# or deleting this DaemonSet triggers `--unlink-on-exit` on graceful shutdown
# (`SIGTERM`); after forced termination (`SIGKILL`), delete `/var/run/cdi/freetpu.json`
# on the host directly.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: freetpu-cdi-sync
  namespace: kube-system
  labels:
    app.kubernetes.io/name: freetpu-cdi-sync
    app.kubernetes.io/component: tpu-ops
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: freetpu-cdi-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freetpu-cdi-sync
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-tpu-accelerator
                    operator: In
                    values:
                      - tpu-v5-lite-device
                      - tpu-v5-lite-podslice
                      - tpu-v5p-slice
                      - tpu-v6e-slice
                  - key: freetpu.dev/cdi-enabled
                    operator: In
                    values:
                      - "true"
      tolerations:
        - key: google.com/tpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: freetpu-cdi-sync
          image: python:3.12-slim
          command:
            - python3
            - /opt/freetpu/freetpu_cdi.py
            - sync
            - --output
            - /var/run/cdi/freetpu.json
            - --interval
            - "15"
            - --unlink-on-exit
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            # Mount only the narrow sysfs subpaths needed for PCI and IOMMU
            # discovery (never whole-host /sys) so containerd's read-only
            # /sys/fs/cgroup mount is never shadowed by a writable host cgroup.
            - name: sysfs-bus-pci
              mountPath: /sys/bus/pci
              readOnly: true
            - name: sysfs-devices
              mountPath: /sys/devices
              readOnly: true
            - name: sysfs-iommu-groups
              mountPath: /sys/kernel/iommu_groups
              readOnly: true
            - name: dev-vfio
              mountPath: /dev/vfio
              readOnly: true
            - name: cdi-dir
              mountPath: /var/run/cdi
            - name: freetpu-ops
              mountPath: /opt/freetpu
              readOnly: true
      volumes:
        - name: sysfs-bus-pci
          hostPath:
            path: /sys/bus/pci
            type: Directory
        - name: sysfs-devices
          hostPath:
            path: /sys/devices
            type: Directory
        - name: sysfs-iommu-groups
          hostPath:
            path: /sys/kernel/iommu_groups
            type: Directory
        - name: dev-vfio
          hostPath:
            # DirectoryOrCreate lets freetpu-cdi-sync start even if vfio-pci
            # failed to initialize so it can invalidate any stale CDI spec.
            path: /dev/vfio
            type: DirectoryOrCreate
        - name: cdi-dir
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: freetpu-ops
          configMap:
            name: freetpu-ops-scripts
---
# Restrict ingress to the node exporter's :9400/metrics port strictly to the
# trusted billing Prometheus scraper so tenant workloads cannot read host TPU
# process IDs/activity or compete for the exporter's bounded scrape worker pool.
# Requires a CNI enforcing Kubernetes NetworkPolicy (e.g. GKE Dataplane V2,
# Cilium, or Calico); note that Kubernetes NetworkPolicy always permits traffic
# originating from the exporter's own node, so on CNIs that treat same-node
# `hostNetwork: true` pods as node traffic, also forbid tenant `hostNetwork: true`
# pods via admission controls (e.g. ValidatingAdmissionPolicy) OR front :9400
# with an authenticating proxy such as kube-rbac-proxy (mTLS/RBAC). On clusters
# without NetworkPolicy enforcement, always front :9400 with an authenticating
# proxy. Adjust the namespaceSelector and podSelector below to match your
# billing Prometheus pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: freetpu-node-agent-metrics
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: freetpu-tpu-exporter
      freetpu.dev/collector-role: node
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9400
