# FreeTPU Node DaemonSet (VFIO-backed GKE Cloud TPU nodes: v5e, v5p, v6e Trillium):
# Scope: Node-level boot-scoped CDI spec sync + PCI/VFIO inventory & hostPID
# active-PID telemetry ONLY. This DaemonSet uses stock `python:3.12-slim` without
# `tpu-info` and runs outside workload Pod network namespaces, so it does NOT emit
# live HBM usage or MXU duty cycle. For live HBM + duty-cycle telemetry in
# Kubernetes, run a `tpu-info`-enabled exporter sidecar inside each TPU workload
# Pod so it shares `localhost:8431` with `libtpu` (see
# `k8s-tpu-workload-telemetry-sidecar.yaml`).
#
# Prerequisite (create the required ConfigMap in kube-system first):
#   kubectl -n kube-system create configmap freetpu-ops-scripts \
#     --from-file=ops/tpu-cdi/freetpu_cdi.py \
#     --from-file=ops/tpu-exporter/tpu_exporter.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Targets VFIO-backed GKE TPU node pools (`tpu-v5-lite-device`,
# `tpu-v5-lite-podslice`, `tpu-v5p-slice`, `tpu-v6e-slice`); excludes legacy
# `/dev/accel*` v4 node pools (`tpu-v4-podslice`). Adjust `nodeAffinity` if your
# cluster uses custom TPU node labels.
#
# 1. initContainer runs `freetpu_cdi.py generate` to populate boot-scoped
#    `/var/run/cdi/freetpu.json` (and remove any stale spec on failure) before
#    the agent becomes ready.
# 2. `freetpu-cdi-sync` continuously revalidates live IOMMU group membership and
#    PCI BDF bindings, regenerating `/var/run/cdi/freetpu.json` atomically on
#    valid topology changes and unlinking it immediately if a VFIO group is
#    reassigned or exposes a non-TPU device.
# 3. `tpu-exporter` serves PCI/VFIO inventory and hostPID active-PID Prometheus
#    `/metrics` on :9400 (with SYS_PTRACE + AppArmor Unconfined, required on GKE
#    because GKE's default container AppArmor profile blocks ptrace-mediated
#    `/proc/<pid>/fd` reads across peers with different AppArmor profiles;
#    `appArmorProfile` is GA in Kubernetes >= 1.30) and an isolated
#    liveness/readiness endpoint on :9401 (`/healthz`) independent of scrape
#    traffic saturation.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: freetpu-node-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: freetpu-tpu-exporter
    app.kubernetes.io/component: tpu-ops
    freetpu.dev/collector-role: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: freetpu-tpu-exporter
      freetpu.dev/collector-role: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freetpu-tpu-exporter
        freetpu.dev/collector-role: node
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
        prometheus.io/path: "/metrics"
    spec:
      hostPID: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-tpu-accelerator
                    operator: In
                    values:
                      - tpu-v5-lite-device
                      - tpu-v5-lite-podslice
                      - tpu-v5p-slice
                      - tpu-v6e-slice
      tolerations:
        - key: google.com/tpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: freetpu-cdi-init
          image: python:3.12-slim
          command:
            - python3
            - /opt/freetpu/freetpu_cdi.py
            - generate
            - --output
            - /var/run/cdi/freetpu.json
            - --validate
          securityContext:
            privileged: true
          volumeMounts:
            - name: sysfs
              mountPath: /sys
              readOnly: true
            - name: dev-vfio
              mountPath: /dev/vfio
              readOnly: true
            - name: cdi-dir
              mountPath: /var/run/cdi
            - name: freetpu-ops
              mountPath: /opt/freetpu
              readOnly: true
      containers:
        - name: freetpu-cdi-sync
          image: python:3.12-slim
          command:
            - python3
            - /opt/freetpu/freetpu_cdi.py
            - sync
            - --output
            - /var/run/cdi/freetpu.json
            - --interval
            - "15"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: sysfs
              mountPath: /sys
              readOnly: true
            - name: dev-vfio
              mountPath: /dev/vfio
              readOnly: true
            - name: cdi-dir
              mountPath: /var/run/cdi
            - name: freetpu-ops
              mountPath: /opt/freetpu
              readOnly: true
        - name: tpu-exporter
          image: python:3.12-slim
          command:
            - python3
            - /opt/freetpu/tpu_exporter.py
            - --host
            - 0.0.0.0
            - --port
            - "9400"
            - --health-port
            - "9401"
          securityContext:
            # Required on GKE alongside hostPID + SYS_PTRACE: GKE's default
            # AppArmor profile restricts ptrace-mediated /proc/<pid>/fd reads
            # to peers sharing the same profile, which otherwise blocks reads
            # of host processes and suppresses host-wide PID telemetry.
            appArmorProfile:
              type: Unconfined
            capabilities:
              add:
                - SYS_PTRACE
          ports:
            - name: metrics
              containerPort: 9400
              protocol: TCP
            - name: health
              containerPort: 9401
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: sysfs
              mountPath: /sys
              readOnly: true
            - name: dev-vfio
              mountPath: /dev/vfio
              readOnly: true
            - name: freetpu-ops
              mountPath: /opt/freetpu
              readOnly: true
      volumes:
        - name: sysfs
          hostPath:
            path: /sys
            type: Directory
        - name: dev-vfio
          hostPath:
            path: /dev/vfio
            type: Directory
        - name: cdi-dir
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: freetpu-ops
          configMap:
            name: freetpu-ops-scripts
