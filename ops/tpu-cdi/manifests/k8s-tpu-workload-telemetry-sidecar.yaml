# Sample Kubernetes TPU workload Pod with a co-located `tpu-exporter` live
# telemetry native sidecar (HBM usage + MXU duty cycle).
#
# Why a sidecar?
#   `libtpu` serves its runtime metrics gRPC endpoint on `localhost:8431` inside
#   the workload Pod's network namespace. A separate host-level DaemonSet cannot
#   reach a workload Pod's `localhost:8431`. Running `tpu_exporter.py` with
#   `tpu-info` installed as a native sidecar (`initContainers` with
#   `restartPolicy: Always`, stable in Kubernetes >= 1.29) inside the workload
#   Pod shares the same network namespace so `tpu-info` queries `localhost:8431`
#   directly while terminating cleanly when the workload container exits.
#
# Prerequisites:
#   1. Build and push the `tpu-info`-enabled exporter image:
#        docker build --build-arg INSTALL_TPU_INFO=1 \
#          -t <registry>/freetpu-tpu-exporter:tpu-info ops/tpu-exporter
#   2. Patched containerd (`>= 2.1.9`, `>= 2.2.5`, or `>= 2.3.2`, or a distro/GKE
#      build patched for CVE-2026-53492 / GHSA-33vj-92qq-66hc / GCP-2026-037;
#      otherwise disable/block untrusted checkpoint restores before publishing
#      CDI specs so tenants cannot bypass DRA to claim `freetpu.dev/tpu=all`),
#      Kubernetes >= 1.34 with `resource.k8s.io/v1` DRA, a cluster DRA driver
#      for `freetpu.dev`,
#      the `ml-workloads` namespace (`kubectl create namespace ml-workloads`),
#      and `DeviceClass` / `ResourceClaimTemplate` from `k8s-tpu-pod-cdi.yaml`
#      (deployed in `ml-workloads` to match `prometheus-scrape-diagnostics.yml`;
#      adjust `metadata.namespace` and the scrape allowlist together if using a
#      different namespace).
#      GKE exclusive allocation requirement: this Pod reserves TPUs through a
#      custom FreeTPU DRA ResourceClaim rather than GKE's native `google.com/tpu`
#      extended resource. Run it ONLY on a dedicated/tainted TPU node pool where
#      `google.com/tpu` scheduling is unused/disabled, OR with a DRA driver that
#      coordinates exclusive chip ownership with GKE's native allocator (otherwise
#      both allocators can hand out the same VFIO group concurrently).
#   3. Replace `<registry>/freetpu-tpu-exporter:tpu-info` and the workload image
#      with your JAX or PyTorch/XLA TPU container image.
#   4. Note: `tpu-info` exposes `freetpu_tpu_runtime_hbm_used_bytes` and
#      `freetpu_tpu_runtime_duty_cycle_percent` keyed by `libtpu` runtime chip
#      ID by default; mount/pass `--chip-id-map` if you also need verified
#      per-PCI-BDF joins.
---
apiVersion: v1
kind: Pod
metadata:
  name: freetpu-jax-workload-with-telemetry
  namespace: ml-workloads
  labels:
    app.kubernetes.io/name: freetpu-tpu-exporter
    freetpu.dev/collector-role: workload-sidecar
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9400"
    prometheus.io/path: "/metrics"
spec:
  restartPolicy: Never
  # Share ONLY the Pod network namespace (`127.0.0.1:8431`), NOT the PID
  # namespace (`shareProcessNamespace: false` by default). The sidecar runs
  # with `--no-pid-scan`, zero capabilities (`drop: [ALL]`), and no `/dev/vfio`
  # mount so containerd's default AppArmor profile never blocks runtime HBM or
  # duty-cycle telemetry via cross-profile `/proc/<pid>/fd` reads. Host PID
  # tracking remains isolated in the node-level `freetpu-node-agent` DaemonSet.
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
  initContainers:
    - name: tpu-exporter-sidecar
      restartPolicy: Always
      image: <registry>/freetpu-tpu-exporter:tpu-info
      args:
        - --host
        - 0.0.0.0
        - --port
        - "9400"
        - --health-host
        - 127.0.0.1
        - --health-port
        - "9401"
        - --no-pid-scan
        - --runtime-metrics-addr
        - 127.0.0.1:8431
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      ports:
        - name: metrics
          containerPort: 9400
          protocol: TCP
      # Health listener stays on loopback (127.0.0.1:9401) and is probed locally
      # via exec so pod-network traffic cannot saturate liveness checks.
      readinessProbe:
        exec:
          command:
            - python3
            - -c
            - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9401/readyz', timeout=2).read()"
        initialDelaySeconds: 2
        periodSeconds: 10
      livenessProbe:
        exec:
          command:
            - python3
            - -c
            - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9401/healthz', timeout=2).read()"
        initialDelaySeconds: 5
        periodSeconds: 30
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 200m
          memory: 256Mi
      volumeMounts:
        # Mount only the narrow sysfs subpaths needed for PCI generation
        # discovery (never whole-host `/sys` and never `/dev/vfio`) so
        # containerd's read-only `/sys/fs/cgroup` mount is never shadowed and
        # the sidecar has zero VFIO device visibility.
        - name: sysfs-bus-pci
          mountPath: /sys/bus/pci
          readOnly: true
        - name: sysfs-devices
          mountPath: /sys/devices
          readOnly: true
  containers:
    - name: jax-tpu
      image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:latest
      command:
        - python3
        - -c
        - "import jax, time; print('JAX TPU devices:', jax.devices()); time.sleep(3600)"
      securityContext:
        capabilities:
          add:
            - IPC_LOCK
      resources:
        # Requires exclusive TPU ownership on GKE (dedicated/tainted node pool
        # without `google.com/tpu` workloads, or a DRA driver coordinated with
        # GKE's native `google.com/tpu` allocator) to prevent double-allocation.
        claims:
          - name: tpu
        requests:
          memory: "8Gi"
          cpu: "2"
        limits:
          memory: "16Gi"
          cpu: "4"
  resourceClaims:
    - name: tpu
      resourceClaimTemplateName: freetpu-all-claim
  volumes:
    - name: sysfs-bus-pci
      hostPath:
        path: /sys/bus/pci
        type: Directory
    - name: sysfs-devices
      hostPath:
        path: /sys/devices
        type: Directory
