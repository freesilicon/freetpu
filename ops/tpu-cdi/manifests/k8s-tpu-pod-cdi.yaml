# Sample Kubernetes DRA workload requesting a FreeTPU CDI device (stable resource.k8s.io/v1).
# Prerequisites:
#   1. Patched containerd (`>= 2.1.9`, `>= 2.2.5`, or `>= 2.3.2`, or a distro/GKE
#      build patched for CVE-2026-53492 / GHSA-33vj-92qq-66hc / GCP-2026-037) —
#      or disable/block untrusted container checkpoint restores on TPU nodes
#      before publishing `/var/run/cdi/freetpu.json` (unpatched containerd 2.x
#      releases allow Pod checkpoint restores to smuggle CDI annotations and
#      bypass DRA to obtain published CDI devices including `freetpu.dev/tpu=all`;
#      containerd 1.7.0 also lacks CDI v0.6.0 and CRI `CDIDevices`). Patched
#      containerd 2.x ships CDI >= 0.6.0 (`annotations`), native CRI `CDIDevices`
#      injection, and `enable_cdi = true` by default; pair with boot-scoped
#      /var/run/cdi/freetpu.json populated by k8s-tpu-cdi-daemonset.yaml on
#      VFIO-backed Cloud TPU nodes (v5e, v5p, v6e Trillium).
#   2. Kubernetes >= 1.34 with stable Dynamic Resource Allocation (`resource.k8s.io/v1`,
#      enabled by default) AND a cluster DRA kubelet/controller driver registered for
#      driver `freetpu.dev` that publishes ResourceSlices and injects
#      `freetpu.dev/tpu=...` CDI IDs in NodePrepareResources (`freetpu-cdi` alone writes
#      containerd specs only).
#   3. GKE exclusive TPU allocation: on GKE, run FreeTPU DRA claims ONLY on a
#      dedicated/tainted TPU node pool where `google.com/tpu` scheduling is
#      unused/disabled, OR use a DRA driver that coordinates exclusive chip
#      ownership with GKE's native `google.com/tpu` allocator to prevent
#      concurrent double-allocation of the same VFIO group.
#   For older Kubernetes 1.32-1.33 clusters serving only `resource.k8s.io/v1beta1`
#   (requires `--runtime-config=resource.k8s.io/v1beta1=true` and
#   `DynamicResourceAllocation=true`), use `k8s-tpu-pod-cdi-v1beta1.yaml`.
#   For single-node passthrough without Kubernetes DRA, use `freetpu_cdi.py docker-args`.
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: freetpu.dev
spec:
  selectors:
    - cel:
        expression: device.driver == "freetpu.dev"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: freetpu-all-claim
  namespace: ml-workloads
spec:
  spec:
    devices:
      requests:
        - name: tpu
          exactly:
            deviceClassName: freetpu.dev
---
apiVersion: v1
kind: Pod
metadata:
  name: freetpu-jax-workload
  namespace: ml-workloads
spec:
  restartPolicy: Never
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: jax-tpu
      image: python:3.12-slim
      command:
        - python3
        - -c
        - "import os; print('VFIO nodes:', sorted(os.listdir('/dev/vfio')))"
      securityContext:
        capabilities:
          add:
            - IPC_LOCK
      resources:
        claims:
          - name: tpu
        requests:
          memory: "8Gi"
          cpu: "2"
        limits:
          memory: "16Gi"
          cpu: "4"
  resourceClaims:
    - name: tpu
      resourceClaimTemplateName: freetpu-all-claim
