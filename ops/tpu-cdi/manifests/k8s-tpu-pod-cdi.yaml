# Sample Kubernetes DRA workload requesting a FreeTPU CDI device.
# Prerequisites:
#   1. containerd >= 1.7 with `enable_cdi = true` (default in containerd 2.0)
#      and /var/run/cdi/freetpu.json populated by k8s-tpu-cdi-daemonset.yaml.
#   2. Kubernetes >= 1.32 with Dynamic Resource Allocation (DRA) enabled AND a
#      cluster DRA kubelet/controller driver registered for driver `freetpu.dev`
#      that publishes ResourceSlices and injects `freetpu.dev/tpu=...` CDI IDs
#      in NodePrepareResources (freetpu-cdi alone writes containerd specs only).
#   For single-node passthrough without Kubernetes DRA, use `freetpu_cdi.py docker-args`.
---
apiVersion: resource.k8s.io/v1beta1
kind: DeviceClass
metadata:
  name: freetpu.dev
spec:
  selectors:
    - cel:
        expression: device.driver == "freetpu.dev"
---
apiVersion: resource.k8s.io/v1beta1
kind: ResourceClaimTemplate
metadata:
  name: freetpu-all-claim
spec:
  spec:
    devices:
      requests:
        - name: tpu
          deviceClassName: freetpu.dev
---
apiVersion: v1
kind: Pod
metadata:
  name: freetpu-jax-workload
spec:
  restartPolicy: Never
  containers:
    - name: jax-tpu
      image: python:3.12-slim
      command:
        - python3
        - -c
        - "import os; print('VFIO nodes:', sorted(os.listdir('/dev/vfio')))"
      securityContext:
        capabilities:
          add:
            - IPC_LOCK
      resources:
        claims:
          - name: tpu
        requests:
          memory: "8Gi"
          cpu: "2"
        limits:
          memory: "16Gi"
          cpu: "4"
  resourceClaims:
    - name: tpu
      resourceClaimTemplateName: freetpu-all-claim
