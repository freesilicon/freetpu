# Prometheus scrape configuration for FreeTPU tpu-exporter (DCGM-exporter equivalent).
# Point static_configs or Kubernetes pod/node discovery at port 9400 on Cloud TPU VMs.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "freetpu-tpu-exporter"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "127.0.0.1:9400"
        labels:
          cluster: "cloud-tpu-v5e-v6e"

  # Kubernetes DaemonSet pod discovery (scrape pods annotated with prometheus.io/scrape: "true").
  - job_name: "kubernetes-freetpu-exporter"
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: "freetpu-tpu-exporter"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
