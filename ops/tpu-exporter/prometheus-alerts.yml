# Prometheus alerting rules for FreeTPU Cloud TPU fleets (ops/tpu-exporter/tpu_exporter.py).
#
# Scrape/evaluation timing notes:
# - Pair with ops/tpu-exporter/prometheus-scrape.yml (`scrape_interval: 15s`,
#   `evaluation_interval: 15s`). Range windows (`[5m]`) also retain >= 5 samples
#   at Prometheus's default 1m scrape interval.
# - Runtime-only fallback clauses (`{pci_bdf="unmapped"}`) fire ONLY for chips
#   that could not be mapped to a PCI BDF, preventing duplicate alerts when a
#   runtime chip is already mapped to a PCI-labeled metric.
# - `GcpSpotPreemption` is for fleet observability/incident tracking only — do
#   NOT rely on Prometheus scraping for time-critical Spot checkpointing.
groups:
  - name: freetpu-tpu-alerts
    rules:
      - alert: TpuHbmOOMWarning
        expr: |
          (
            freetpu_tpu_hbm_utilization_ratio > 0.95
          )
          or
          (
            freetpu_tpu_runtime_hbm_used_bytes{pci_bdf="unmapped"}
            / (freetpu_tpu_runtime_hbm_total_bytes{pci_bdf="unmapped"} > 0) > 0.95
          )
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "TPU HBM utilization above 95% on {{ $labels.node }} ({{ $labels.pci_bdf }})"
          description: >-
            TPU HBM usage exceeded 95% of capacity for 1 minute. Trigger dynamic
            batch-size reduction, KV cache eviction, or re-sharding before OOM.

      - alert: TpuMxuDutyCycleCollapse
        expr: |
          (
            avg_over_time(freetpu_tpu_duty_cycle_percent[5m]) < 10
          )
          or
          (
            avg_over_time(freetpu_tpu_runtime_duty_cycle_percent{pci_bdf="unmapped"}[5m]) < 10
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "TPU MXU duty cycle collapsed (<10%) on {{ $labels.node }}"
          description: >-
            TensorCore / MXU duty cycle remained below 10% over 5 minutes while
            runtime telemetry is active. Investigate input-pipeline stalls or
            ICI collective barriers.

      - alert: TpuPcieAerFault
        # 5m range window provides multiple scrapes even at Prometheus's default
        # 1m scrape interval (and 20 samples at the recommended 15s interval).
        expr: increase(freetpu_pcie_aer_fatal_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Fatal PCIe AER fault detected on {{ $labels.node }} ({{ $labels.pci_bdf }})"
          description: >-
            Unrecoverable PCIe Advanced Error Reporting (AER) fatal error count
            increased on TPU device {{ $labels.pci_bdf }}. Cordon the node and
            run hardware diagnostics / reboot.

      # Monitoring/observability alert only (requires short scrape/evaluation
      # intervals such as 15s in prometheus-scrape.yml; Prometheus's default 1m
      # interval can miss GCP Spot's best-effort <=30s shutdown window).
      # Time-critical checkpointing MUST use a workload-local metadata watcher
      # (`wait_for_change=true`) or SIGTERM handler inside the training job.
      - alert: GcpSpotPreemption
        expr: gcp_metadata_preempted_status == 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "GCP Spot preemption notice observed on {{ $labels.node }}"
          description: >-
            Monitoring alert only: GCP instance metadata reported
            preempted=TRUE on {{ $labels.node }}. Because Spot VMs have zero
            guaranteed advance notice and a best-effort shutdown window of up to
            30s, time-critical checkpointing (e.g. Orbax emergency checkpoint)
            must be driven by a workload-local metadata watcher or SIGTERM
            shutdown handler rather than Prometheus scrape/alert evaluation.
