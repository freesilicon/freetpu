[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freetpu-tile"
version = "0.1.0"
description = "Clean-room Python Tile DSL (@freetpu.tile_kernel) lowering to Edge TPU (buenos_a0) and Cloud TPU (Pallas/Mosaic)"
readme = "docs/tile-dsl/README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
tpu = ["jax[tpu]"]

[tool.setuptools]
include-package-data = true
packages = [
    "freetpu_tile",
    "freetpu_tile.backends",
    "freetpu_tile.tests",
    "freetpu_tile._packaged_docs",
    "freetpu_tile._packaged_examples",
    "tools",
    "tools.dgc0",
    "libopenbuenos",
    "libopenbuenos.include",
    "libopenbuenos.src",
]

[tool.setuptools.package-dir]
"freetpu_tile._packaged_docs" = "docs"
"freetpu_tile._packaged_examples" = "examples/tile_dsl"

[tool.setuptools.package-data]
tools = ["*.py"]
"tools.dgc0" = ["*.py"]
libopenbuenos = ["Makefile", "CMakeLists.txt"]
"libopenbuenos.include" = ["*.h"]
"libopenbuenos.src" = ["*.cpp", "*.h"]
"freetpu_tile._packaged_docs" = ["baremetal-vii/*.h", "kernel-abi/*.h"]
"freetpu_tile._packaged_examples" = ["*.py"]
